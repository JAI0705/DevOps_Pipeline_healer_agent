version: "3.9"

services:
  healer-api:
    build: .
    container_name: pipeline-healer
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOG_JSON=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
